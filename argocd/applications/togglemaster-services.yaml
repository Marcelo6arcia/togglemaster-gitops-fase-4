apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: togglemaster-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - git:
      repoURL: https://github.com/Marcelo6arcia/togglemaster-gitops-fase-4.git
      revision: main
      directories:
      - path: apps/overlays/dev/*
  template:
    metadata:
      name: '{{.path.basename}}'
      labels:
        app.kubernetes.io/part-of: togglemaster
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: togglemaster
      source:
        repoURL: https://github.com/Marcelo6arcia/togglemaster-gitops-fase-4.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: togglemaster
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
      ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
        - /spec/replicas
      - group: apps
        kind: Deployment
        name: auth-service
        jsonPointers:
        - /spec/template/metadata/annotations/fiap.dev~1incident-restart
