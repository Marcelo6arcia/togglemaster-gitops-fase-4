apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: apm-credentials
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: observability-secrets
    kind: SecretStore
  target:
    name: apm-credentials
    creationPolicy: Owner
  data:
  - secretKey: NEW_RELIC_LICENSE_KEY
    remoteRef:
      key: togglemaster/dev/observability/apm
      property: NEW_RELIC_LICENSE_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: incident-integrations
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: observability-secrets
    kind: SecretStore
  target:
    name: incident-integrations
    creationPolicy: Owner
  data:
  - secretKey: RESPONDER_TOKEN
    remoteRef:
      key: togglemaster/dev/observability/incidents
      property: RESPONDER_TOKEN
  - secretKey: PAGERDUTY_INTEGRATION_KEY
    remoteRef:
      key: togglemaster/dev/observability/incidents
      property: PAGERDUTY_INTEGRATION_KEY
  - secretKey: DISCORD_WEBHOOK_URL
    remoteRef:
      key: togglemaster/dev/observability/incidents
      property: DISCORD_WEBHOOK_URL
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: observability-secrets
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
  - secretKey: admin-user
    remoteRef:
      key: togglemaster/dev/observability/grafana
      property: admin-user
  - secretKey: admin-password
    remoteRef:
      key: togglemaster/dev/observability/grafana
      property: admin-password
